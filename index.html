<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCTV Footage</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <video id="camera" autoplay playsinline muted></video>
    <canvas id="hud"></canvas>

    <div id="cctvFrame">
        <div id="cctvStatus"><span class="rec-dot"></span>REC</div>
        <div id="cctvTimestamp">00:00:00</div>
        <div id="cctvFooter">CAM 03 • LIVE FEED</div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
